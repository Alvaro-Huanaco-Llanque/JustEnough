spring.application.name=core-backend
spring.config.import=optional:file:.env

# Configuración del servidor
server.port=8080

# Orígenes del frontend permitidos por CORS (separados por coma)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Conexión a la Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (Manejo de tablas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cuenta compartida del equipo de desarrollo (se crea sola al arrancar).
# Poner app.seed.dev-account=false para no crearla (por ejemplo, en producción).
app.seed.dev-account=true
app.seed.dev-email=jetest@gmail.com
app.seed.dev-password=jetest123

# URL del frontend (se usa para armar el link del mail de verificación)
app.frontend-url=http://localhost:5173

# Envío de mails (Gmail). Cada uno pone MAIL_USERNAME y MAIL_PASSWORD en su .env.
# MAIL_PASSWORD es una "contraseña de aplicación" de Google, no la contraseña normal de la cuenta.
# Si MAIL_USERNAME queda vacío, no se manda nada y el link de verificación se imprime en la consola.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
